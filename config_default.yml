# =============================================================================
# Default configuration for the Sturgeon Live Classifier app.
#
# You do not need to edit this file by hand -- the Setup tab in the app reads
# and writes it for you, and saves your edits to <output_folder>/config.yml
# so each case/run can keep its own copy. This file is just the template used
# the very first time the app starts and no saved config exists yet.
# =============================================================================

# --- MinKNOW / sequencing run ---
bam_pass_folder: ""        # MinKNOW's realtime BAM output folder, e.g. .../bam_pass -- contains barcode01/, barcode02/, ..., unclassified/
barcode: "01"               # barcode to monitor, e.g. "01".."24"
use_unclassified: true      # also include reads MinKNOW couldn't assign a barcode to

# --- Where this app writes its own outputs ---
output_folder: ""           # a fresh, empty folder per case, e.g. ~/sturgeon_runs/case_2026-08-22

# --- Timing ---
poll_interval_sec: 15       # how often to check for new BAM files
cnv_every_n_iterations: 5   # auto-generate a CNV plot every N processed iterations

# --- External tools (full paths recommended, especially if sturgeon lives in
#     a conda/venv environment that isn't activated when the app launches) ---
samtools_bin: "samtools"
modkit_bin: "modkit"        # used directly now (adjust-mods + extract full), not just via sturgeon
sturgeon_bin: "sturgeon"
extra_path_dirs: []          # e.g. ["/home/user/miniconda3/envs/sturgeon/bin"] -- needed so
                              # modkit/sturgeon resolve if they aren't on PATH already

# --- Reference / model files (ask your sequencing setup for these paths) ---
# Note: the reference genome itself (chm13v2.0.fa) isn't listed here -- MinKNOW
# already aligned reads to it in real time before this app ever sees the BAMs.
probes_file: ""              # probelocs_chm13.bed (used by Sturgeon v1, and by v2 too unless probes_file_v2 is set)
model_file_v1: ""             # sturgeon v1 model.zip -- required
bins_rds: ""                    # DNAcopy/QDNAseq bins .rds for CNV plotting
cnvplot_reffile: ""              # bins_export.bed reference coverage file
relevant_genes_bed: ""            # optional: gene labels overlay for CNV plot
color_translation_rds: ""          # named list/vector: tumor class -> plot color

# --- Sturgeon v2 (optional) ---
# Leave model_file_v2 blank to run v1 only. When filled in, the app runs
# both models each iteration and shows two separate confidence-over-time
# plots side by side. v2 reuses v1's extracted bed file (confirmed this is
# supported) unless probes_file_v2 is set, so running v2 alongside v1 adds
# only a second (fast) prediction call, not a second full pipeline.
#
# sturgeon-v2 has a different CLI than v1 (`sturgeon-v2 single/multi -i ... -m
# ... [-c NUM_CPGS] -o ... [-s NUM_SAMPLINGS] -f FILE_TYPE`). sturgeon_v2_bin,
# sturgeon_v2_mode and sturgeon_v2_file_type are REQUIRED once model_file_v2
# is set. num_cpgs/num_samplings are OPTIONAL -- confirmed against
# sturgeon-v2's own --help: left blank, sturgeon-v2 itself defaults to using
# all available CpG sites and 1 random sampling, so the app simply omits
# -c/-s from the command when these are blank rather than guessing a value.
model_file_v2: ""              # sturgeon v2 model file -- optional, enables v2 when set
probes_file_v2: ""              # only needed if v2 requires a different probes file than v1
sturgeon_v2_bin: "sturgeon-v2"  # the sturgeon-v2 executable (or full path, e.g. in its own venv)
sturgeon_v2_mode: "single"       # "single" or "multi" -- "single" = one sample at a time, matches this app's per-iteration use
sturgeon_v2_num_cpgs: ""          # optional -- a number of CpG sites; blank = sturgeon-v2 uses all available sites
sturgeon_v2_num_samplings: ""      # optional -- a number; blank = sturgeon-v2's default of 1 random sampling
sturgeon_v2_file_type: "bed"        # best guess (v2's input is a bed file) -- verify against sturgeon-v2 docs
